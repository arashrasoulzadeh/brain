id: auth
title: Authentication
description: Project-scoped account and session functions.
version: 0.1.0
host_api: 1
entrypoint: src/index.ts
dependencies: []
capabilities:
  - auth.signin
  - auth.session
  - auth.guest
extension_points:
  - auth.provider
config_schema:
  registration: string
routes:
  - operation: auth.signup
    function: signup
    capability: auth.signup
  - operation: auth.signin
    function: signin
    capability: auth.signin
  - operation: auth.session
    function: session
    capability: auth.session
  - operation: auth.guest
    function: guest
    capability: auth.guest
