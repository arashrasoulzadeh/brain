id: auth
title: Authentication
description: Project-scoped account and session functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - sign-in-request.ts
  - sign-up-request.ts
  - oidc-state-issuer.ts
  - oidc-state-consumer.ts
  - delivery-writer.ts
  - delivery-reader.ts
  - oidc-config-writer.ts
  - oidc-config-reader.ts
  - authorization-code-issuer.ts
  - authorization-code-consumer.ts
