  - ./account-session-rotator.js
  - ./account-session-revoker.js
  - ./account-password-resetter.js
  - ./guest-session-issuer.js
  - ./guest-account-upgrader.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - auth.signin
  - auth.session
  - auth.guest
extension_points:
  - auth.provider
config_schema:
  registration: string
routes:
  - operation: auth.signup
    function: signup
    capability: auth.signup
  - operation: auth.signin
    function: signin
    capability: auth.signin
  - operation: auth.session
    function: session
    capability: auth.session
  - operation: auth.guest
    function: guest
    capability: auth.guest
