  - operator-session-issuer.ts
  - operator-session-validator.ts
  - operator-session-revoker.ts
  - session-token-digest.ts
  - otp-types.ts
  - email-otp-issuer.ts
  - email-otp-verifier.ts
  - sms-otp-issuer.ts
  - sms-otp-verifier.ts
  - recovery-token-issuer.ts
  - recovery-token-consumer.ts
  - auth-state.ts
  - account-signup.ts
  - account-signin.ts
  - account-session-reader.ts
  - account-session-rotator.ts
  - account-session-revoker.ts
  - account-password-resetter.ts
  - guest-session-issuer.ts
  - guest-account-upgrader.ts
  - guest-request.ts
imports:
  - ../sdk-typescript/src/index.js
  - node:crypto
  - "@node-rs/argon2"
  - ./guest-request.js
  - ./sign-in-request.js
  - ./sign-up-request.js
  - ./oidc-state-issuer.js
  - ./oidc-state-consumer.js
  - ./delivery-writer.js
  - ./delivery-reader.js
  - ./oidc-config-writer.js
  - ./oidc-config-reader.js
  - ./authorization-code-issuer.js
