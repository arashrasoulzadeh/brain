id: auth
title: Authentication
description: Project-scoped account and session functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - sign-in-request.ts
  - sign-up-request.ts
  - oidc-state-issuer.ts
  - oidc-state-consumer.ts
  - delivery-writer.ts
  - delivery-reader.ts
  - guest-request.ts
imports:
  - ../sdk-typescript/src/index.js
  - node:crypto
  - "@node-rs/argon2"
  - ./guest-request.js
  - ./sign-in-request.js
  - ./sign-up-request.js
  - ./oidc-state-issuer.js
  - ./oidc-state-consumer.js
  - ./delivery-writer.js
  - ./delivery-reader.js
plugin_imports:
dependencies: []
capabilities:
  - auth.signin
  - auth.session
  - auth.guest
extension_points:
  - auth.provider
config_schema:
  registration: string
routes:
  - operation: auth.signup
    function: signup
    capability: auth.signup
  - operation: auth.signin
    function: signin
    capability: auth.signin
  - operation: auth.session
    function: session
    capability: auth.session
  - operation: auth.guest
    function: guest
    capability: auth.guest
