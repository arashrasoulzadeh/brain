id: auth
title: Authentication
description: Project-scoped account and session functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - oidc.ts
  - delivery.ts
  - sessions.ts
  - otp.ts
  - state.ts
  - accounts.ts
  - rate-limits.ts
  - service.ts
imports:
  - ../sdk-typescript/src/index.js
  - ../sdk-typescript/src/tokens.js
  - node:crypto
  - "@node-rs/argon2"
  - ./oidc.js
  - ./delivery.js
  - ./sessions.js
  - ./otp.js
  - ./state.js
  - ./accounts.js
  - ./rate-limits.js
  - ./service.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - auth.signup
  - auth.signin
  - auth.session
  - auth.guest
extension_points:
  - auth.provider
config_schema:
  registration: string
routes:
  - operation: auth.signup
    function: signup
    helper: sdk.request
    capability: auth.signup
  - operation: auth.signin
    function: signin
    helper: sdk.request
    capability: auth.signin
  - operation: auth.session
    function: session
    helper: sdk.request
    capability: auth.session
  - operation: auth.guest
    function: guest
    helper: sdk.request
    capability: auth.guest
