id: auth
title: Authentication
description: Project-scoped account and session functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - requests.ts
  - oidc.ts
  - delivery.ts
  - sessions.ts
  - otp.ts
  - state.ts
  - accounts.ts
  - rate-limits.ts
  - service.ts
imports:
  - ../sdk-typescript/src/index.js
  - node:crypto
  - "@node-rs/argon2"
  - ./requests.js
  - ./oidc.js
  - ./delivery.js
  - ./sessions.js
  - ./otp.js
  - ./state.js
  - ./accounts.js
  - ./rate-limits.js
  - ./service.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - auth.signup
  - auth.signin
  - auth.session
  - auth.guest
  - auth.admin.read
  - auth.admin.manage
extension_points:
  - auth.provider
config_schema:
  registration: string
events:
  - name: account.created
    fields: {created: boolean}
  - name: session.established
    fields: {guest: boolean}
  - name: sessions.revoked
    fields: {}
routes:
  - operation: auth.signup
    function: signup
    helper: sdk.request
    capability: auth.signup
  - operation: auth.signin
    function: signin
    helper: sdk.request
    capability: auth.signin
  - operation: auth.session
    function: session
    helper: sdk.request
    capability: auth.session
  - operation: auth.identity
    function: identity
    helper: sdk.request
    capability: auth.session
  - operation: auth.guest
    function: guest
    helper: sdk.request
    capability: auth.guest

  - operation: auth.admin.accounts
    function: listAccounts
    helper: sdk.request
    capability: auth.admin.read
  - operation: auth.admin.sessions.revoke
    function: revokeSessions
    helper: sdk.request
    capability: auth.admin.manage
    resource_field: username
admin:
  version: 1
  pages:
    - id: accounts
      title: Accounts and sessions
      refresh_on: [auth.account.created, auth.session.established, auth.sessions.revoked]
      actions:
        - title: List accounts
          operation: auth.admin.accounts
          read_only: true
          fields:
            - {name: after, type: string}
          result:
            type: grid
            children:
              - {type: table, path: rows, title: Accounts, page_size: 25}
              - {type: detail, path: next, title: Next cursor}
        - title: Revoke user sessions
          operation: auth.admin.sessions.revoke
          fields:
            - {name: username, type: string, required: true}
