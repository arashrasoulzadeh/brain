id: tables
title: Tables
description: Project-scoped data table functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - access.ts
  - schema.ts
  - records.ts
  - capture.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./schema.js
  - ./records.js
  - ./capture.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - tables.read
  - tables.write
  - tables.schema
extension_points:
  - data.policy
config_schema:
  exposure: string
routes:
  - operation: tables.read
    function: read
    response:
      input:
        - name: table
          type: string
          trim: true
          required: true
          error: table is required
        - name: rows
          type: array
          required: true
          error: rows unavailable
      output:
        table: $input.table
        rows: $input.rows
    helper: sdk.resource
    capability: tables.read
    storage:
      action: rows.read
      key: table
      target: rows
  - operation: tables.write
    function: write
    response:
      input:
        - name: table
          type: string
          trim: true
          required: true
          error: table is required
        - name: row
          type: object
          required: true
          error: row is required
      output:
        table: $input.table
        row: $input.row
        written: true
    helper: sdk.resource
    capability: tables.write
    storage:
      action: rows.append
      key: table
      input: row
  - operation: tables.schema
    function: schema
    helper: sdk.resource
    capability: tables.schema
    storage:
      action: rows.schema
      key: table
      target: columns
    response:
      input:
        - name: table
          type: string
          required: true
          trim: true
          error: table is required
        - name: columns
          type: array
          required: true
          error: schema unavailable
      output:
        table: $input.table
        columns: $input.columns
