id: tables
title: Tables
description: Project-scoped data table functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - access.ts
  - schema.ts
  - records.ts
  - capture.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./schema.js
  - ./records.js
  - ./capture.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - tables.read
  - tables.write
  - tables.schema
extension_points:
  - data.policy
config_schema:
  exposure: string
routes:
  - operation: tables.read
    function: read
    helper: sdk.dispatch
    capability: tables.read
  - operation: tables.write
    function: write
    helper: sdk.dispatch
    capability: tables.write
  - operation: tables.schema
    function: schema
    helper: sdk.dispatch
    capability: tables.schema
admin:
  version: 1
  pages:
    - id: operations
      title: Tables operations
      actions:
        - title: read
          operation: tables.read
          fields:
            - name: table
              type: string
              required: true
        - title: schema
          operation: tables.schema
          fields:
            - name: table
              type: string
              required: true
