id: tables
title: Tables
description: Project-scoped data table functions.
version: 0.1.0
host_api: 1
mount: /tables
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - access.ts
  - schema.ts
  - records.ts
  - capture.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./schema.js
  - ./records.js
  - ./capture.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - tables.read
  - tables.write
  - tables.schema
extension_points:
  - data.policy
config_schema:
  exposure: string
events:
  - name: record.written
    fields: {written: boolean}
routes:
  - operation: tables.read
    method: GET
    path: /read
    auth: operator
    function: read
    helper: sdk.dispatch
    capability: tables.read
    resource_field: table
  - operation: tables.write
    method: POST
    path: /write
    auth: operator
    function: write
    helper: sdk.dispatch
    capability: tables.write
    resource_field: table
  - operation: tables.schema
    method: GET
    path: /schema
    auth: operator
    function: schema
    helper: sdk.dispatch
    capability: tables.schema
    resource_field: table
admin:
  version: 1
  pages:
    - id: operations
      title: Database
      legacy_route: database
      inventory:
        kind: table_names
        capability: tables.read
        title: Tables
        select_field: table
      refresh_on:
        - tables.record.written
      actions:
        - title: Table schema
          operation: tables.schema
          read_only: true
          result:
            type: detail
          fields:
            - name: table
              type: string
              required: true
        - title: Read rows
          operation: tables.read
          read_only: true
          result:
            type: table
            path: rows
            page_size: 25
          fields:
            - name: table
              type: string
              required: true
        - title: Write row
          operation: tables.write
          fields:
            - name: table
              type: string
              required: true
            - name: row
              type: json
              required: true
