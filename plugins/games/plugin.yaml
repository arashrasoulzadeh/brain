id: games
title: Games
description: Game-specific rules and modes, including Tic-Tac-Toe.
version: 0.1.0
host_api: 1
mount: /games
entrypoint: index.ts
source_files:
  - index.ts
  - tic-tac-toe.ts
  - recovery.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./tic-tac-toe.js
  - ./recovery.js
plugin_imports:
dependencies: []
capabilities:
  - games.modes
extension_points:
  - games.rules
config_schema: {}
routes:
  - operation: games.modes
    method: GET
    path: /
    auth: operator
    function: modes
    helper: sdk.context
    capability: games.modes

  - operation: games.mode.describe
    method: POST
    path: /mode
    auth: operator
    function: describeMode
    helper: sdk.context
    capability: games.modes

admin:
  version: 1
  pages:
    - id: modes
      title: Game modes
      legacy_route: games
      actions:
        - title: List supported modes
          operation: games.modes
          read_only: true
          result: {type: detail}
        - title: Inspect built-in game rules
          operation: games.mode.describe
          read_only: true
          fields:
            - {name: mode, type: string, required: true}
          result: {type: detail}
