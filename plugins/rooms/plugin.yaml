id: rooms
title: Rooms
description: Project-scoped room and membership functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - directory.ts
  - gameplay.ts
  - recovery.ts
  - access.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - node:crypto
  - ./directory.js
  - ./gameplay.js
  - ./recovery.js
  - ./access.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - rooms.create
  - rooms.join
  - rooms.reconnect
  - rooms.result
extension_points:
  - rooms.runtime
config_schema:
  maxPlayers: int
routes:
  - operation: rooms.create
    function: create
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: room id is required
        - name: room
          type: object
          required: true
          error: room not found
      result: $input.room

    helper: sdk.dispatch
    capability: rooms.create
    storage:
      action: state.create
      key: id
      target: room
      values:
        id: $input.id
        members: []
  - operation: rooms.join
    function: join
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: room id and member are required
        - name: member
          type: string
          trim: true
          required: true
          error: room id and member are required
        - name: room
          type: object
          required: true
          error: room not found
      merge: room
      output:
        member: $input.member
        reconnected: false

    helper: sdk.dispatch
    capability: rooms.join
    storage:
      action: state.add_unique
      key: id
      target: room
      field: members
      input: member
  - operation: rooms.reconnect
    function: reconnect
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: room id and member are required
        - name: member
          type: string
          trim: true
          required: true
          error: room id and member are required
        - name: room
          type: object
          required: true
          error: room not found
      merge: room
      output:
        member: $input.member
        reconnected: true

    helper: sdk.dispatch
    capability: rooms.reconnect
    storage:
      action: state.add_unique
      key: id
      target: room
      field: members
      input: member
  - operation: rooms.result
    function: result
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: room id is required
        - name: room
          type: object
          required: true
          error: room not found
      result: $input.room

    helper: sdk.dispatch
    capability: rooms.result
    storage:
      action: state.patch
      key: id
      target: room
      field: result
      input: result
