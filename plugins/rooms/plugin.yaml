id: rooms
title: Rooms
description: Project-scoped room and membership functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - directory.ts
  - gameplay.ts
  - recovery.ts
  - access.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - node:crypto
  - ./directory.js
  - ./gameplay.js
  - ./recovery.js
  - ./access.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - rooms.create
  - rooms.join
  - rooms.reconnect
  - rooms.result
extension_points:
  - rooms.runtime
config_schema:
  maxPlayers: int
events:
  - name: connected
    fields:
      roomId: string
      reconnected: boolean
routes:
  - operation: rooms.create
    function: create
    helper: sdk.dispatch
    capability: rooms.create
  - operation: rooms.join
    function: join
    helper: sdk.dispatch
    capability: rooms.join
  - operation: rooms.reconnect
    function: reconnect
    helper: sdk.dispatch
    capability: rooms.reconnect
  - operation: rooms.result
    function: result
    helper: sdk.dispatch
    capability: rooms.result
admin:
  version: 1
  pages:
    - id: operations
      title: Rooms operations
      refresh_on:
        - rooms.connected
      actions:
        - title: result
          operation: rooms.result
          read_only: true
          fields:
            - name: id
              type: string
              required: true
    - id: submit-result
      title: Submit room result
      actions:
        - title: submit result
          operation: rooms.result
          fields:
            - name: id
              type: string
              required: true
            - name: result
              type: json
              required: true
