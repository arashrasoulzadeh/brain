id: rooms
title: Rooms
description: Project-scoped room and membership functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - directory.ts
  - access.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - node:crypto
  - ./directory.js
  - ./access.js
  - ./index.js
plugin_imports:
dependencies: []
capabilities:
  - rooms.create
  - rooms.join
  - rooms.reconnect
  - rooms.result
extension_points:
  - rooms.runtime
config_schema:
  maxPlayers: int
events:
  - name: connected
    fields:
      roomId: string
      reconnected: boolean
  - name: created
    fields: {roomId: string}
  - name: reconnected
    fields: {roomId: string}
  - name: result.committed
    fields: {roomId: string}
routes:
  - operation: rooms.create
    function: create
    helper: sdk.dispatch
    capability: rooms.create
    resource_field: id
  - operation: rooms.join
    function: join
    helper: sdk.dispatch
    capability: rooms.join
    resource_field: id
  - operation: rooms.reconnect
    function: reconnect
    helper: sdk.dispatch
    capability: rooms.reconnect
    resource_field: id
  - operation: rooms.result
    function: result
    helper: sdk.dispatch
    capability: rooms.result
    resource_field: id
admin:
  version: 1
  pages:
    - id: operations
      title: Room details
      extension_slots:
        - tab
      legacy_route: live-sessions
      inventory:
        kind: state_keys
        capability: rooms.result
        title: Rooms
        select_field: id
      refresh_on:
        - rooms.connected
        - rooms.created
        - rooms.reconnected
        - rooms.result.committed
      actions:
        - title: Get room result
          operation: rooms.result
          read_only: true
          result:
            type: detail
          fields:
            - name: id
              type: string
              required: true
    - id: manage
      title: Manage rooms
      legacy_route: live-sessions
      actions:
        - title: Create room
          operation: rooms.create
          fields:
            - name: id
              type: string
              required: true
        - title: Join room
          operation: rooms.join
          fields:
            - name: id
              type: string
              required: true
            - name: member
              type: string
              required: true
        - title: Reconnect member
          operation: rooms.reconnect
          fields:
            - name: id
              type: string
              required: true
            - name: member
              type: string
              required: true
        - title: Submit result
          operation: rooms.result
          fields:
            - name: id
              type: string
              required: true
            - name: result
              type: json
              required: true
