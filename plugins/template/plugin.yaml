id: example.plugin
entrypoint: index.ts
source_files:
  - index.ts
imports:
  - ../sdk-typescript/src/index.js
plugin_imports:
title: Example plugin
description: Minimal host-discovered TypeScript plugin template.
version: 0.1.0
host_api: 1
dependencies: []
capabilities:
  - example.plugin.example
  - observe.rooms.connected
extension_points: []
config_schema: {}
events:
  - name: exampleCompleted
    fields: {}
observe:
  - plugin: rooms
    event: connected
    function: observeRoomConnected
    capability: observe.rooms.connected
    persist: true
routes:
