id: example.plugin
runtime: declarative
title: Example plugin
description: Minimal manifest-only plugin.
version: 0.1.0
host_api: 1
dependencies: []
capabilities:
  - example.echo
extension_points: []
config_schema: {}
routes:
  - operation: example.echo
    function: echo
    capability: example.echo
    helper: sdk.response
    response:
      input:
        - name: message
          type: string
          required: true
          error: message is required
      output:
        message: $input.message
