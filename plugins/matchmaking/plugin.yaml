id: matchmaking
title: Matchmaking
description: Project-scoped queue and assignment functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - config.ts
  - queue.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./config.js
  - ./queue.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
dependencies:
capabilities:
  - matchmaking.queue
  - matchmaking.cancel
  - matchmaking.status
  - matchmaking.assign
extension_points:
  - matchmaking.policy
config_schema:
  ticketTtlSeconds: int
  matchSize: int
routes:
  - operation: matchmaking.queue
    function: queue
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: ticket id is required
        - name: ticket
          type: object
          required: true
          error: ticket not found
      result: $input.ticket
    helper: sdk.resource
    capability: matchmaking.queue
    storage:
      action: state.create
      key: id
      target: ticket
      values:
        id: $input.id
        status: queued
  - operation: matchmaking.cancel
    function: cancel
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: ticket id is required
        - name: ticket
          type: object
          required: true
          error: ticket not found
      result: $input.ticket
    helper: sdk.resource
    capability: matchmaking.cancel
    storage:
      action: state.patch
      key: id
      target: ticket
      values:
        status: cancelled
  - operation: matchmaking.status
    function: status
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: ticket id is required
        - name: ticket
          type: object
          required: true
          error: ticket not found
      result: $input.ticket
    helper: sdk.resource
    capability: matchmaking.status
    storage:
      action: state.read
      key: id
      target: ticket
  - operation: matchmaking.assign
    function: assign
    response:
      input:
        - name: id
          type: string
          trim: true
          required: true
          error: ticket id is required
        - name: ticket
          type: object
          required: true
          error: ticket not found
      result: $input.ticket
    helper: sdk.resource
    capability: matchmaking.assign
    storage:
      action: state.patch
      key: id
      target: ticket
      values:
        status: assigned
