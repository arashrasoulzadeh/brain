id: matchmaking
title: Matchmaking
description: Project-scoped queue and assignment functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - config.ts
  - queue.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./config.js
  - ./queue.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
dependencies:
capabilities:
  - matchmaking.queue
  - matchmaking.cancel
  - matchmaking.status
  - matchmaking.assign
extension_points:
  - matchmaking.policy
config_schema:
  ticketTtlSeconds: int
  matchSize: int
routes:
  - operation: matchmaking.queue
    function: queue
    helper: sdk.dispatch
    capability: matchmaking.queue
  - operation: matchmaking.cancel
    function: cancel
    helper: sdk.dispatch
    capability: matchmaking.cancel
  - operation: matchmaking.status
    function: status
    helper: sdk.dispatch
    capability: matchmaking.status
  - operation: matchmaking.assign
    function: assign
    helper: sdk.dispatch
    capability: matchmaking.assign
admin:
  version: 1
  pages:
    - id: operations
      title: Matchmaking operations
      actions:
        - title: status
          operation: matchmaking.status
