id: matchmaking
title: Matchmaking
description: Project-scoped queue and assignment functions.
version: 0.1.0
host_api: 1
mount: /matchmaking
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - config.ts
  - queue.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./config.js
  - ./queue.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
dependencies:
optional_dependencies: [rooms@0.1.0]
capabilities:
  - matchmaking.queue
  - matchmaking.cancel
  - matchmaking.status
  - matchmaking.assign
extension_points:
  - matchmaking.policy
config_schema:
  ticketTtlSeconds: int
  matchSize: int
events:
  - name: queued
    fields: {status: string}
  - name: assigned
    fields: {status: string}
  - name: cancelled
    fields: {status: string}
routes:
  - operation: matchmaking.queue
    method: POST
    path: /queue
    auth: operator
    function: queue
    helper: sdk.dispatch
    capability: matchmaking.queue
    resource_field: id
  - operation: matchmaking.cancel
    method: POST
    path: /cancel
    auth: operator
    function: cancel
    helper: sdk.dispatch
    capability: matchmaking.cancel
    resource_field: id
  - operation: matchmaking.status
    method: POST
    path: /status
    auth: operator
    function: status
    helper: sdk.dispatch
    capability: matchmaking.status
    resource_field: id
  - operation: matchmaking.assign
    method: POST
    path: /assign
    auth: operator
    function: assign
    helper: sdk.dispatch
    capability: matchmaking.assign
    resource_field: id
admin:
  version: 1
  pages:
    - id: operations
      title: Matchmaking
      legacy_route: live-sessions
      inventory:
        kind: state_keys
        capability: matchmaking.status
        title: Tickets
        select_field: id
      extends: rooms/operations
      extends_slot: tab
      refresh_on:
        - matchmaking.queued
        - matchmaking.assigned
        - matchmaking.cancelled
      actions:
        - title: Get ticket status
          operation: matchmaking.status
          read_only: true
          fields:
            - name: id
              type: string
              required: true
        - title: Queue ticket
          operation: matchmaking.queue
          fields:
            - name: id
              type: string
              required: true
        - title: Cancel ticket
          operation: matchmaking.cancel
          fields:
            - name: id
              type: string
              required: true
        - title: Assign ticket
          operation: matchmaking.assign
          fields:
            - name: id
              type: string
              required: true
