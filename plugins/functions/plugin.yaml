id: functions
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - invocation.ts
  - publication.ts
  - compiler.ts
  - sandbox.ts
  - scheduling.ts
  - workflow.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - node:fs
  - node:os
  - node:path
  - node:net
  - ./invocation.js
  - ./publication.js
  - ./compiler.js
  - ./sandbox.js
  - ./scheduling.js
  - ./workflow.js
  - ./index.js
plugin_imports:
title: Functions
description: Project-scoped serverless function compilation and invocation controls.
version: 0.1.0
host_api: 1
dependencies: []
capabilities:
  - functions.invoke
  - functions.publish
  - functions.call
extension_points: []
config_schema:
  maxSourceBytes: int
routes:
  - operation: functions.invoke
    function: invoke
    helper: sdk.response
    capability: functions.invoke
    resource_field: name
    response:
      input:
        - name: name
          type: string
          required: true
          trim: true
          error: function name is required
        - name: input
          type: value
      output:
        name: $input.name
        input: $input.input
        invoked: true
  - operation: functions.publish
    function: publish
    helper: sdk.response
    capability: functions.publish
    resource_field: name
    response:
      input:
        - name: name
          type: string
          trim: true
          required: true
          error: function name, source, and version are required
        - name: source
          type: string
          required: true
          error: function name, source, and version are required
        - name: version
          type: string
          trim: true
          required: true
          error: function name, source, and version are required
      output:
        name: $input.name
        version: $input.version
        published: true
  - operation: functions.call
    function: call
    helper: sdk.dispatch
    capability: functions.call
    resource_field: name
admin:
  version: 1
  pages:
    - id: operations
      title: Function operations
      legacy_route: workflows
      actions:
        - title: Invoke function
          operation: functions.invoke
          fields:
            - name: name
              type: string
              required: true
            - name: input
              type: json
        - title: Publish function
          operation: functions.publish
          fields:
            - name: name
              type: string
              required: true
            - name: source
              type: string
              required: true
            - name: version
              type: string
              required: true
