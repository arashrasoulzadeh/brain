id: files
title: Files
description: Project-scoped object storage functions.
version: 0.1.0
host_api: 1
mount: /files
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - access.ts
  - uploads.ts
  - quota.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./uploads.js
  - ./quota.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - files.upload
  - files.download
  - files.metadata
  - files.publish
extension_points:
  - files.storage
config_schema:
  bucket: string
  maxUploadBytes: int
public_config: [maxUploadBytes]
events:
  - name: uploaded
    fields: {size: number}
  - name: published
    fields: {published: boolean}
routes:
  - operation: files.upload
    method: POST
    path: /upload
    auth: operator
    function: upload
    helper: sdk.dispatch
    capability: files.upload
    resource_field: key
  - operation: files.download
    method: POST
    path: /download
    auth: operator
    function: download
    helper: sdk.dispatch
    capability: files.download
    resource_field: key
  - operation: files.metadata
    method: POST
    path: /metadata
    auth: operator
    function: metadata
    helper: sdk.dispatch
    capability: files.metadata
    resource_field: key
  - operation: files.publish
    method: POST
    path: /publish
    auth: operator
    function: publish
    helper: sdk.dispatch
    capability: files.publish
    resource_field: key
admin:
  version: 1
  pages:
    - id: operations
      title: Files
      legacy_route: files
      inventory:
        kind: file_keys
        capability: files.metadata
        title: Files
        select_field: key
      refresh_on:
        - files.uploaded
        - files.published
      actions:
        - title: File metadata
          operation: files.metadata
          read_only: true
          result:
            type: grid
            children:
              - type: metric
                title: Size (bytes)
                path: size
              - type: detail
                title: Object details
              - type: detail
                title: Original file metadata
                path: metadata
          fields:
            - name: key
              type: string
              required: true
        - title: Download file
          operation: files.download
          read_only: true
          fields:
            - name: key
              type: string
              required: true
        - title: Upload file
          operation: files.upload
          fields:
            - name: key
              type: string
              required: true
            - name: data
              type: string
              required: true
            - name: filename
              type: string
            - name: contentType
              type: string
        - title: Publish file
          operation: files.publish
          fields:
            - name: key
              type: string
              required: true
