id: files
title: Files
description: Project-scoped object storage functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
dependencies: []
capabilities:
  - files.upload
  - files.download
  - files.metadata
  - files.publish
extension_points:
  - files.storage
config_schema:
  bucket: string
routes:
  - operation: files.upload
    function: upload
    capability: files.upload
  - operation: files.download
    function: download
    capability: files.download
  - operation: files.metadata
    function: metadata
    capability: files.metadata
  - operation: files.publish
    function: publish
    capability: files.publish
