id: files
title: Files
description: Project-scoped object storage functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - access.ts
  - uploads.ts
  - quota.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./uploads.js
  - ./quota.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - files.upload
  - files.download
  - files.metadata
  - files.publish
extension_points:
  - files.storage
config_schema:
  bucket: string
routes:
  - operation: files.upload
    function: upload
    response:
      input:
        - name: key
          type: string
          trim: true
          required: true
          error: file key is required
        - name: data
          type: string
          required: true
          error: file data is required
      output:
        key: $input.key
        uploaded: true
        published: false
    helper: sdk.resource
    capability: files.upload
    storage:
      action: blob.put
      key: key
      input: data
  - operation: files.download
    function: download
    response:
      input:
        - name: key
          type: string
          trim: true
          required: true
          error: file key is required
        - name: data
          type: string
          required: true
          error: file data is required
        - name: published
          type: boolean
          required: true
          error: file not found
      output:
        key: $input.key
        data: $input.data
        published: $input.published
    helper: sdk.resource
    capability: files.download
    storage:
      action: blob.read
      key: key
      target: data
      field: published
  - operation: files.metadata
    function: metadata
    response:
      input:
        - name: key
          type: string
          trim: true
          required: true
          error: file key is required
        - name: data
          type: string
          required: true
          error: file data is required
        - name: published
          type: boolean
          required: true
          error: file not found
      output:
        key: $input.key
        published: $input.published
        size: $length.data
    helper: sdk.resource
    capability: files.metadata
    storage:
      action: blob.read
      key: key
      target: data
      field: published
  - operation: files.publish
    function: publish
    response:
      input:
        - name: key
          type: string
          trim: true
          required: true
          error: file key is required
        - name: published
          type: boolean
          required: true
          error: file not found
      output:
        key: $input.key
        published: $input.published
    helper: sdk.resource
    capability: files.publish
    storage:
      action: blob.publish
      key: key
      target: published
