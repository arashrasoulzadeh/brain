id: files
title: Files
description: Project-scoped object storage functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - file-request.ts
  - bucket.ts
  - object-key.ts
  - upload-store.ts
  - quota.ts
  - file-grant-store.ts
  - file-access-reader.ts
  - file-access-deleter.ts
  - upload-grant-store.ts
  - authorized-upload-writer.ts
  - enforce-upload-size.ts
  - protected-download-headers.ts
  - reconcile-orphaned-objects.ts
  - require-explicit-publication.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./bucket.js
  - ./enforce-upload-size.js
  - ./protected-download-headers.js
  - ./reconcile-orphaned-objects.js
  - ./require-explicit-publication.js
  - ./file-request.js
  - ./object-key.js
  - ./quota.js
  - ./file-grant-store.js
  - ./file-access-reader.js
  - ./file-access-deleter.js
  - ./upload-grant-store.js
  - ./authorized-upload-writer.js
  - ./upload-store.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - files.upload
  - files.download
  - files.metadata
  - files.publish
extension_points:
  - files.storage
config_schema:
  bucket: string
routes:
  - operation: files.upload
    function: upload
    capability: files.upload
  - operation: files.download
    function: download
    capability: files.download
  - operation: files.metadata
    function: metadata
    capability: files.metadata
  - operation: files.publish
    function: publish
    capability: files.publish
