id: files
title: Files
description: Project-scoped object storage functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - routes.ts
  - index.ts
  - types.ts
  - access.ts
  - uploads.ts
  - quota.ts
imports:
  - ./routes.js
  - ../sdk-typescript/src/index.js
  - ./access.js
  - ./uploads.js
  - ./quota.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - files.upload
  - files.download
  - files.metadata
  - files.publish
extension_points:
  - files.storage
config_schema:
  bucket: string
routes:
  - operation: files.upload
    function: upload
    helper: sdk.dispatch
    capability: files.upload
  - operation: files.download
    function: download
    helper: sdk.dispatch
    capability: files.download
  - operation: files.metadata
    function: metadata
    helper: sdk.dispatch
    capability: files.metadata
  - operation: files.publish
    function: publish
    helper: sdk.dispatch
    capability: files.publish
admin:
  version: 1
  pages:
    - id: operations
      title: File operations
      actions:
        - title: metadata
          operation: files.metadata
