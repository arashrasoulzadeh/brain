<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain Admin</title>
<style>body{font:16px system-ui;background:#f4f7fb;color:#172033;margin:0}main{max-width:720px;margin:10vh auto;padding:32px;background:#fff;border-radius:16px;box-shadow:0 12px 40px #17203318}h1{margin-top:0}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5e3;border-radius:8px;font:inherit}button{margin-top:20px;background:#2357d8;color:#fff;border:0;cursor:pointer}.error{color:#b42318}.hidden{display:none}.project{padding:12px 0;border-bottom:1px solid #e5eaf2}</style></head>
<body><main><section id="login"><h1>Brain Admin</h1><p>Sign in with your operator account.</p><form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="secret">Secret</label><input id="secret" type="password" autocomplete="current-password" required><button>Sign in</button><p id="login-error" class="error" role="alert"></p></form></section><section id="workspace" class="hidden"><h1>Projects</h1><p id="status"></p><div id="projects"></div><button id="logout" type="button">Sign out</button></section></main>
<script>
const login=document.querySelector('#login'),workspace=document.querySelector('#workspace'),error=document.querySelector('#login-error'),status=document.querySelector('#status'),projects=document.querySelector('#projects');let session='';
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const response=await fetch('/admin/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,secret:secret.value})});if(!response.ok){error.textContent='Sign in failed.';return}session=(await response.json()).session;login.classList.add('hidden');workspace.classList.remove('hidden');status.textContent='Authenticated operator session.';projects.innerHTML='<div class="project">Project management is ready for the authenticated admin API.</div>'});document.querySelector('#logout').addEventListener('click',()=>{session='';workspace.classList.add('hidden');login.classList.remove('hidden')});
</script></body></html>
