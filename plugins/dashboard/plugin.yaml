id: dashboard
title: Dashboard
description: Trusted operator project and plugin administration.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - requests.ts
  - pages.ts
  - views.ts
  - bridge.ts
  - audit.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./requests.js
  - ./pages.js
  - ./audit.js
  - ./views.js
  - ./bridge.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - project.manage
  - plugin.install
  - plugin.grant
  - plugin.enable
  - plugin.promote
  - plugin.rollback
  - plugin.disable
  - plugin.lifecycle
  - plugin.uninstall
  - plugin.readiness
extension_points:
  - admin.navigation
  - admin.page
config_schema:
  title: string
routes:
  - operation: project.create
    function: createProject
    capability: project.manage
  - operation: plugin.install
    function: installPlugin
    capability: plugin.install
  - operation: plugin.grant
    function: grantCapability
    capability: plugin.grant
  - operation: plugin.enable
    function: enablePlugin
    capability: plugin.enable
  - operation: plugin.promote
    function: promotePlugin
    capability: plugin.promote
  - operation: plugin.rollback
    function: rollbackPlugin
    capability: plugin.rollback
  - operation: plugin.disable.preview
    function: previewPluginDisable
    capability: plugin.disable
  - operation: plugin.disable.apply
    function: applyPluginDisable
    capability: plugin.disable
  - operation: plugin.drain
    function: drainPlugin
    capability: plugin.lifecycle
  - operation: plugin.resume
    function: resumePlugin
    capability: plugin.lifecycle
  - operation: plugin.stop
    function: stopPlugin
    capability: plugin.lifecycle
  - operation: plugin.uninstall
    function: uninstallPlugin
    capability: plugin.uninstall
  - operation: plugin.readiness
    function: showReadiness
    capability: plugin.readiness
