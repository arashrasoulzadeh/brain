id: dashboard
title: Dashboard
description: Trusted operator project and plugin administration.
version: 0.1.0
host_api: 1
entrypoint: index.ts
dependencies: []
capabilities:
  - project.manage
  - plugin.install
  - plugin.grant
  - plugin.enable
  - plugin.readiness
extension_points:
  - admin.navigation
  - admin.page
config_schema:
  title: string
routes:
  - operation: project.create
    function: createProject
    capability: project.manage
  - operation: plugin.install
    function: installPlugin
    capability: plugin.install
  - operation: plugin.grant
    function: grantCapability
    capability: plugin.grant
  - operation: plugin.enable
    function: enablePlugin
    capability: plugin.enable
  - operation: plugin.readiness
    function: showReadiness
    capability: plugin.readiness
