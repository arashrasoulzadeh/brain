id: dashboard
title: Dashboard
description: Trusted operator project and plugin administration.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - project-request.ts
  - admin-request.ts
  - auth-settings-page.ts
  - signup-settings-page.ts
  - record-browser-page.ts
  - record-edit-page.ts
  - table-management-page.ts
  - file-management-page.ts
  - host-owned-admin-view.ts
  - project-overview-contribution.ts
  - plugin-health-contribution.ts
  - form-audit-recorder.ts
  - form-audit-reader.ts
  - browser-quickstart.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./admin-request.js
  - ./form-audit-recorder.js
  - ./form-audit-reader.js
  - ./auth-settings-page.js
  - ./browser-quickstart.js
  - ./file-management-page.js
  - ./host-owned-admin-view.js
  - ./project-overview-contribution.js
  - ./plugin-health-contribution.js
  - ./project-request.js
  - ./record-browser-page.js
  - ./record-edit-page.js
  - ./signup-settings-page.js
  - ./table-management-page.js
  - ./types.js
plugin_imports:
dependencies: []
capabilities:
  - project.manage
  - plugin.install
  - plugin.grant
  - plugin.enable
  - plugin.readiness
extension_points:
  - admin.navigation
  - admin.page
config_schema:
  title: string
routes:
  - operation: project.create
    function: createProject
    capability: project.manage
  - operation: plugin.install
    function: installPlugin
    capability: plugin.install
  - operation: plugin.grant
    function: grantCapability
    capability: plugin.grant
  - operation: plugin.enable
    function: enablePlugin
    capability: plugin.enable
  - operation: plugin.readiness
    function: showReadiness
    capability: plugin.readiness
