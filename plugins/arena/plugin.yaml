id: arena
title: Arena
description: Project-scoped cooperative match functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - match-results.ts
  - state-machine.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./state-machine.js
  - ./match-results.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
  - matchmaking@0.1.0
dependencies:
capabilities:
  - arena.start
  - arena.input
  - arena.snapshot
  - arena.result
extension_points: []
config_schema:
  tickRate: int
  maxPlayers: int
events:
  - name: started
    fields:
      roomId: string
      playerCount: number
  - name: finished
    fields:
      roomId: string
      winnerCount: number
routes:
  - operation: arena.start
    function: start
    helper: sdk.context
    capability: arena.start
  - operation: arena.input
    function: input
    helper: sdk.context
    capability: arena.input
  - operation: arena.snapshot
    function: snapshot
    helper: sdk.context
    capability: arena.snapshot
  - operation: arena.result
    function: result
    helper: sdk.context
    capability: arena.result
