id: arena
title: Arena
description: Project-scoped cooperative match functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - match-results.ts
  - state-machine.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./state-machine.js
  - ./match-results.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
  - matchmaking@0.1.0
dependencies:
optional_dependencies: [rooms@0.1.0, matchmaking@0.1.0]
capabilities:
  - arena.start
  - arena.input
  - arena.snapshot
  - arena.result
extension_points: []
config_schema:
  tickRate: int
  maxPlayers: int
routes:
  - operation: arena.start
    function: start
    capability: arena.start
    resource_field: roomId
  - operation: arena.input
    function: input
    capability: arena.input
    resource_field: roomId
  - operation: arena.snapshot
    function: snapshot
    capability: arena.snapshot
    resource_field: roomId
  - operation: arena.result
    function: result
    capability: arena.result
    resource_field: roomId
