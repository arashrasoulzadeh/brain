id: arena
title: Arena
description: Project-scoped cooperative match functions.
version: 0.1.0
host_api: 1
mount: /arena
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - match-results.ts
  - state-machine.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./state-machine.js
  - ./match-results.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
  - matchmaking@0.1.0
dependencies:
optional_dependencies: [rooms@0.1.0, matchmaking@0.1.0]
capabilities:
  - arena.start
  - arena.input
  - arena.snapshot
  - arena.result
extension_points: []
config_schema:
  tickRate: int
  maxPlayers: int
public_config: [tickRate, maxPlayers]
events:
  - name: started
    fields: {roomId: string, playerCount: number}
  - name: finished
    fields: {roomId: string, winnerCount: number}
routes:
  - operation: arena.start
    method: POST
    path: /start
    auth: operator
    function: start
    helper: sdk.context
    capability: arena.start
    resource_field: roomId
  - operation: arena.input
    method: POST
    path: /input
    auth: operator
    function: input
    helper: sdk.context
    capability: arena.input
    resource_field: roomId
  - operation: arena.connect
    method: POST
    path: /{roomId}/connect
    auth: user
    function: connect
    helper: sdk.context
    capability: arena.snapshot
    resource_field: roomId
  - operation: arena.player.input
    method: POST
    path: /{roomId}/input
    auth: user
    function: playerInput
    helper: sdk.context
    capability: arena.input
    resource_field: roomId
    websocket_admission: arena.connect
  - operation: arena.snapshot
    method: POST
    path: /snapshot
    auth: operator
    function: snapshot
    helper: sdk.context
    capability: arena.snapshot
    resource_field: roomId
  - operation: arena.result
    method: POST
    path: /result
    auth: operator
    function: result
    helper: sdk.context
    capability: arena.result
    resource_field: roomId

admin:
  version: 1
  pages:
    - id: matches
      title: Arena matches
      legacy_route: arena
      extends: rooms/operations
      extends_slot: tab
      inventory:
        kind: state_keys
        capability: arena.snapshot
        title: Matches
        select_field: roomId
      refresh_on: [arena.started, arena.finished]
      actions:
        - title: Inspect match
          operation: arena.snapshot
          read_only: true
          result: {type: detail}
          fields:
            - {name: roomId, type: string, required: true}
        - title: Start match
          operation: arena.start
          fields:
            - {name: roomId, type: string, required: true}
            - {name: players, type: json, required: true}
        - title: Record operator input
          operation: arena.input
          fields:
            - {name: roomId, type: string, required: true}
            - {name: playerId, type: string, required: true}
            - {name: sequence, type: number, required: true}
            - {name: payload, type: json}
        - title: Finish match
          operation: arena.result
          fields:
            - {name: roomId, type: string, required: true}
            - {name: winnerIds, type: json, required: true}
            - {name: completedAt, type: string, required: true}
