id: arena
title: Arena
description: Project-scoped cooperative match functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - match-results.ts
  - state-machine.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./state-machine.js
  - ./match-results.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
  - matchmaking@0.1.0
dependencies:
capabilities:
  - arena.start
  - arena.input
  - arena.snapshot
  - arena.result
extension_points: []
config_schema:
  tickRate: int
  maxPlayers: int
routes:
  - operation: arena.start
    function: start
    capability: arena.start
  - operation: arena.input
    function: input
    capability: arena.input
  - operation: arena.snapshot
    function: snapshot
    capability: arena.snapshot
  - operation: arena.result
    function: result
    capability: arena.result
admin:
  version: 1
  pages:
    - id: operations
      title: Arena operations
      actions:
        - title: snapshot
          operation: arena.snapshot
        - title: result
          operation: arena.result
