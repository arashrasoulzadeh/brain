id: arena
title: Arena
description: Project-scoped cooperative match functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
  - types.ts
  - match-results.ts
  - state-machine.ts
imports:
  - ../sdk-typescript/src/index.js
  - ./index.js
  - ./state-machine.js
  - ./match-results.js
  - ./types.js
plugin_imports:
  - rooms@0.1.0
  - matchmaking@0.1.0
dependencies:
optional_dependencies: [rooms@0.1.0, matchmaking@0.1.0]
capabilities:
  - arena.start
  - arena.input
  - arena.snapshot
  - arena.result
extension_points: []
config_schema:
  tickRate: int
  maxPlayers: int
events:
  - name: started
    fields: {roomId: string, playerCount: number}
  - name: finished
    fields: {roomId: string, winnerCount: number}
routes:
  - operation: arena.start
    function: start
    helper: sdk.context
    capability: arena.start
    resource_field: roomId
  - operation: arena.input
    function: input
    helper: sdk.context
    capability: arena.input
    resource_field: roomId
  - operation: arena.snapshot
    function: snapshot
    helper: sdk.context
    capability: arena.snapshot
    resource_field: roomId
  - operation: arena.result
    function: result
    helper: sdk.context
    capability: arena.result
    resource_field: roomId

admin:
  version: 1
  pages:
    - id: matches
      title: Arena matches
      extends: rooms/operations
      extends_slot: tab
      refresh_on: [arena.started, arena.finished]
      actions:
        - title: Inspect match
          operation: arena.snapshot
          read_only: true
          result: {type: detail}
          fields:
            - {name: roomId, type: string, required: true}
        - title: Start match
          operation: arena.start
          fields:
            - {name: roomId, type: string, required: true}
            - {name: players, type: json, required: true}
        - title: Finish match
          operation: arena.result
          fields:
            - {name: roomId, type: string, required: true}
            - {name: winnerIds, type: json, required: true}
            - {name: completedAt, type: string, required: true}
