id: invites
title: Invites
description: Project-scoped invitation functions.
version: 0.1.0
host_api: 1
entrypoint: index.ts
source_files:
  - index.ts
imports:
  - ../sdk-typescript/src/index.js
  - node:crypto
plugin_imports:
  - rooms@0.1.0
dependencies:
  - rooms@0.1.0
capabilities:
  - invites.create
  - invites.accept
  - invites.cancel
  - invites.inspect
extension_points: []
config_schema:
  ttlSeconds: int
events:
  - name: created
    fields: {}
  - name: accepted
    fields: {}
  - name: cancelled
    fields: {}
routes:
  - operation: invites.create
    function: create
    helper: sdk.context
    capability: invites.create
    resource_field: roomId
  - operation: invites.accept
    function: accept
    helper: sdk.context
    capability: invites.accept
    resource_field: roomId
  - operation: invites.cancel
    function: cancel
    helper: sdk.context
    capability: invites.cancel
    resource_field: roomId

  - operation: invites.inspect
    function: inspect
    helper: sdk.context
    capability: invites.inspect
    resource_field: roomId
admin:
  version: 1
  pages:
    - id: invitations
      title: Invitations
      extends: rooms/operations
      extends_slot: tab
      refresh_on: [invites.created, invites.accepted, invites.cancelled]
      actions:
        - title: List room invitations
          operation: invites.inspect
          read_only: true
          result: {type: table, page_size: 25}
          fields:
            - {name: roomId, type: string, required: true}
            - {name: after, label: After invitation ID, type: string}
        - title: Cancel invitation
          operation: invites.cancel
          fields:
            - {name: roomId, type: string, required: true}
            - {name: inviteId, type: string, required: true}
