id: analytics
entrypoint: index.ts
source_files:
  - index.ts
imports:
  - ../sdk-typescript/src/index.js
plugin_imports:
title: Analytics
description: Project-scoped validated event capture.
version: 0.1.0
host_api: 1
dependencies: []
capabilities:
  - analytics.capture
  - observe.rooms.connected
extension_points: []
config_schema:
  maxFields: int
event_fields:
  - roomId
  - players
  - reconnected
events:
  - name: captured
    fields:
      name: string
observe:
  - plugin: rooms
    event: connected
    function: observeRoomConnected
    capability: observe.rooms.connected
    persist: true
routes:
  - operation: analytics.capture
    function: captureForProject
    helper: sdk.context
    capability: analytics.capture
