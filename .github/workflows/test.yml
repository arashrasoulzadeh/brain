name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l -- $(find cmd internal tests -name '*.go' -type f))"
          printf '%s\n' "$unformatted"
          if test -n "$unformatted"; then
            gofmt -d -- $(find cmd internal tests -name '*.go' -type f)
            exit 1
          fi
      - name: Check development Makefile
        run: python3 -m unittest discover -s tests/development -p 'test_*.py'
      - name: Test
        run: go test ./...
      - name: Check operator session races
        run: go test -race ./tests/operator
      - name: Build backend image
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: brain:test
      - name: Compose smoke test
        run: sh scripts/smoke-compose.sh
      - name: Compose compiler and runner isolation tests
        run: RUN_PLUGIN_ISOLATION_TESTS=1 sh scripts/smoke-compose.sh
      - name: Clean environment deploy and rollback rehearsal
        run: |
          export COMPOSE_FILE=compose.test.yml
          export COMPOSE_PROJECT_NAME=brain-clean-rehearsal
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" down --volumes --remove-orphans
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d --build
          curl --fail --silent --show-error http://127.0.0.1:18080/livez
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" down --volumes --remove-orphans
          scripts/start-compose-no-build.sh
          curl --fail --silent --show-error http://127.0.0.1:18080/livez
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" down --volumes --remove-orphans
      - name: Full deploy rollback and restore rehearsal
        if: ${{ vars.BRAIN_REHEARSAL_ENABLED == 'true' }}
        env:
          COMPOSE_FILE: compose.test.yml
          ROLLBACK_COMPOSE_FILE: ${{ vars.BRAIN_ROLLBACK_COMPOSE_FILE }}
          COMPOSE_PROJECT_NAME: brain-full-rehearsal
          BACKUP_INPUT: ${{ secrets.BRAIN_BACKUP_INPUT }}
          RESTORE_DSN: ${{ secrets.BRAIN_RESTORE_DSN }}
          OBJECT_MANIFEST: ${{ secrets.BRAIN_OBJECT_MANIFEST }}
          BRAIN_BIN: ./brain
        run: sh scripts/clean-environment-rehearsal.sh
  production-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test packaged production startup and sandboxed invocation
        run: timeout 300s bash scripts/test-production-runtime.sh
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:ts
      - run: npm run typecheck
      - run: npm run test:ts
      - name: Run TypeScript sandbox
        run: >-
          docker run --rm --privileged
          -v "${GITHUB_WORKSPACE}:/workspace"
          -w /workspace
          node:20-bookworm
          bash -lc 'apt-get update && apt-get install --yes bubblewrap && NODE_BIN=/usr/local/bin/node TEST_TYPESCRIPT_RUNTIME=1 timeout 60s bash scripts/test-sandboxed-typescript-worker.sh'
  admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-nextjs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
