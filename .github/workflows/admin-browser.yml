name: admin-browser

on:
  workflow_call:
    inputs:
      collect_v8:
        type: boolean
        default: false
  push:
    paths:
      - 'admin-nextjs/**'
      - 'scripts/test-admin-browser.mjs'
      - 'scripts/test-admin-live.mjs'
      - 'scripts/admin-ci-backend-relay.mjs'
      - 'internal/**'
      - 'cmd/**'
      - 'plugins/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/typescript-worker.mjs'
      - 'scripts/run-sandboxed-typescript-worker.sh'
      - '.github/workflows/admin-browser.yml'
  pull_request:
    paths:
      - 'admin-nextjs/**'
      - 'scripts/test-admin-browser.mjs'
      - 'scripts/test-admin-live.mjs'
      - 'scripts/admin-ci-backend-relay.mjs'
      - 'internal/**'
      - 'cmd/**'
      - 'plugins/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/typescript-worker.mjs'
      - 'scripts/run-sandboxed-typescript-worker.sh'
      - '.github/workflows/admin-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    # Match the packaged production-runtime job's sandbox-capable runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRAIN_ADMIN_ORIGIN: http://127.0.0.1:3100
      BRAIN_API_ORIGIN: http://127.0.0.1:18082
      BRAIN_COLLECT_V8: ${{ inputs.collect_v8 || false }}
      BRAIN_V8_DIR: ${{ github.workspace }}/coverage/browser-v8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-nextjs/package-lock.json
      - name: Set isolated test paths
        run: |
          echo "BRAIN_BROWSER_DEPS=$RUNNER_TEMP/brain-admin-browser" >> "$GITHUB_ENV"
          echo "BRAIN_BROWSER_OUTPUT=$RUNNER_TEMP/brain-admin-screenshots" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: admin-nextjs
      - run: npm run build
        working-directory: admin-nextjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$BRAIN_BROWSER_DEPS" --no-audit --no-fund --save-exact playwright@1.56.1
          # Use the runner-provided Chrome rather than installing an older
          # Playwright browser build on a newer, unsupported Linux release.
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          "$chrome" --version
          echo "BRAIN_BROWSER_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Verify the production admin in Chromium
        run: |
          (cd admin-nextjs && exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100) > "$RUNNER_TEMP/brain-admin.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$server" 2>/dev/null; then echo "Admin server stopped before readiness"; exit 1; fi
            if curl --fail --silent "$BRAIN_ADMIN_ORIGIN/_system/ui" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$BRAIN_ADMIN_ORIGIN/_system/ui" > /dev/null
          v8_env=()
          if [ "$BRAIN_COLLECT_V8" = true ]; then
            mkdir -p "$BRAIN_V8_DIR"
            v8_env=("NODE_V8_COVERAGE=$BRAIN_V8_DIR")
          fi
          env "${v8_env[@]}" node scripts/test-admin-browser.mjs
      - name: Verify admin against the packaged backend
        run: |
          export BRAIN_ADMIN_ORIGIN=http://127.0.0.1:3101
          docker build -t brain:admin-browser .
          container=$(docker run -d --privileged --network none -e HTTP_ADDRESS=:8080 -e OPERATOR_USERNAME=ci-operator -e OPERATOR_SECRET=ci-fixture-only -e PROJECTS_FILE=/workspace/.local/brain.sqlite brain:admin-browser)
          for attempt in $(seq 1 5); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              docker logs "$container" 2>&1 || true
              docker rm -f "$container" >/dev/null 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          v8_env=()
          if [ "$BRAIN_COLLECT_V8" = true ]; then
            mkdir -p "$BRAIN_V8_DIR"
            v8_env=("NODE_V8_COVERAGE=$BRAIN_V8_DIR")
          fi
          env "${v8_env[@]}" node scripts/admin-ci-backend-relay.mjs "$container" > "$RUNNER_TEMP/brain-relay.log" 2>&1 &
          relay=$!
          (cd admin-nextjs && exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3101) > "$RUNNER_TEMP/brain-admin-live.log" 2>&1 &
          server=$!
          cleanup() {
            kill "$server" "$relay" 2>/dev/null || true
            wait "$server" "$relay" 2>/dev/null || true
            docker logs "$container" 2>&1 | tee "$RUNNER_TEMP/brain-backend.log" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$server" 2>/dev/null; then echo "Admin server stopped before readiness"; exit 1; fi
            if curl --fail --silent "$BRAIN_ADMIN_ORIGIN/_system/ui" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$BRAIN_ADMIN_ORIGIN/_system/ui" > /dev/null
          env "${v8_env[@]}" node scripts/test-admin-live.mjs
          if [ "$BRAIN_COLLECT_V8" = true ]; then
            # The same network-isolated real backend, with an independent project.
            env "${v8_env[@]}" BRAIN_TEST_ORIGIN="$BRAIN_API_ORIGIN" node scripts/test-runtime-api.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.collect_v8
        with:
          name: typescript-browser-v8
          path: coverage/browser-v8/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-screenshots
          path: |
            ${{ runner.temp }}/brain-admin-screenshots
            ${{ runner.temp }}/brain-admin.log
            ${{ runner.temp }}/brain-admin-live.log
            ${{ runner.temp }}/brain-backend.log
            ${{ runner.temp }}/brain-relay.log
