name: admin-browser

on:
  push:
    paths:
      - 'admin-nextjs/**'
      - 'scripts/test-admin-browser.mjs'
      - 'scripts/test-admin-live.mjs'
      - 'internal/**'
      - 'cmd/**'
      - 'plugins/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/typescript-worker.mjs'
      - 'scripts/run-sandboxed-typescript-worker.sh'
      - '.github/workflows/admin-browser.yml'
  pull_request:
    paths:
      - 'admin-nextjs/**'
      - 'scripts/test-admin-browser.mjs'
      - 'scripts/test-admin-live.mjs'
      - 'internal/**'
      - 'cmd/**'
      - 'plugins/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/typescript-worker.mjs'
      - 'scripts/run-sandboxed-typescript-worker.sh'
      - '.github/workflows/admin-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRAIN_ADMIN_ORIGIN: http://127.0.0.1:3100
      BRAIN_API_ORIGIN: http://127.0.0.1:18082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-nextjs/package-lock.json
      - name: Set isolated test paths
        run: |
          echo "BRAIN_BROWSER_DEPS=$RUNNER_TEMP/brain-admin-browser" >> "$GITHUB_ENV"
          echo "BRAIN_BROWSER_OUTPUT=$RUNNER_TEMP/brain-admin-screenshots" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: admin-nextjs
      - run: npm run build
        working-directory: admin-nextjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$BRAIN_BROWSER_DEPS" --no-audit --no-fund --save-exact playwright@1.56.1
          "$BRAIN_BROWSER_DEPS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify the production admin in Chromium
        run: |
          (cd admin-nextjs && exec npm run start -- --hostname 127.0.0.1 --port 3100) > "$RUNNER_TEMP/brain-admin.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent "$BRAIN_ADMIN_ORIGIN" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$BRAIN_ADMIN_ORIGIN" > /dev/null
          node scripts/test-admin-browser.mjs
      - name: Verify admin against the packaged backend
        run: |
          docker build -t brain:admin-browser .
          container=$(docker run -d --privileged -p 127.0.0.1:18082:8080 -e HTTP_ADDRESS=:8080 -e OPERATOR_USERNAME=ci-operator -e OPERATOR_SECRET=ci-fixture-only -e PROJECTS_FILE=/workspace/.local/brain.sqlite brain:admin-browser)
          (cd admin-nextjs && exec npm run start -- --hostname 127.0.0.1 --port 3100) > "$RUNNER_TEMP/brain-admin-live.log" 2>&1 &
          server=$!
          cleanup() {
            kill "$server" 2>/dev/null || true
            docker logs "$container" > "$RUNNER_TEMP/brain-backend.log" 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent "$BRAIN_ADMIN_ORIGIN" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$BRAIN_ADMIN_ORIGIN" > /dev/null
          node scripts/test-admin-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-screenshots
          path: |
            ${{ runner.temp }}/brain-admin-screenshots
            ${{ runner.temp }}/brain-admin.log
            ${{ runner.temp }}/brain-admin-live.log
            ${{ runner.temp }}/brain-backend.log
