name: coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Measure host statement coverage
        run: |
          mkdir -p coverage
          go test -covermode=atomic -coverpkg=./internal/...,./cmd/... -coverprofile=coverage/go.out ./...
          go tool cover -func=coverage/go.out | tee coverage/go-summary.txt
          go tool cover -html=coverage/go.out -o coverage/go.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage/
      - name: Require every measured statement to execute
        run: |
          test -s coverage/go.out
          awk 'NR > 1 && $(NF-1) > 0 && $NF == 0 { print; missed++ } END { exit (missed > 0 || NR < 2) }' coverage/go.out
  typescript-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix admin-nextjs
      - name: Measure plugin, client, admin and worker coverage
        run: |
          mkdir -p coverage/raw
          NODE_V8_COVERAGE="$PWD/coverage/raw" npm run test:ts
          python scripts/prepare-v8-coverage.py coverage/raw coverage/c8-input
          npx --yes --package=c8@10.1.3 c8 report --temp-directory=coverage/c8-input --all \
            --src=plugins --src=clients/javascript/src --src=admin-nextjs/app --src=scripts \
            --include='**/*.ts' --include='**/*.tsx' --include='**/*.mjs' \
            --exclude='**/*.d.ts' --reporter=text --reporter=json-summary --reporter=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-coverage
          path: coverage/
      - name: Require 100% in every measured source file
        run: |
          npx --yes --package=c8@10.1.3 c8 check-coverage --temp-directory=coverage/c8-input --all \
            --src=plugins --src=clients/javascript/src --src=admin-nextjs/app --src=scripts \
            --include='**/*.ts' --include='**/*.tsx' --include='**/*.mjs' \
            --exclude='**/*.d.ts' --per-file --lines=100 --functions=100 --branches=100 --statements=100
  flutter-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage ../../tests/flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: clients/flutter/coverage/
      - run: python ../../scripts/check-lcov.py coverage/lcov.info lib
  kotlin-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle test jacocoTestReport jacocoTestCoverageVerification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-coverage
          path: clients/android/build/reports/
