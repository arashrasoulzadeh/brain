name: release-backend

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-backend-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify requested commit is on protected main
        run: |
          set -euo pipefail
          printf '%s\n' "${{ inputs.release_sha }}" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "${{ inputs.release_sha }}" refs/remotes/origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: go test ./...
      - run: npm run typecheck
      - run: npm run lint:ts
      - run: npm run test:ts

  publish-images:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: Dockerfile
          - name: compiler
            dockerfile: Dockerfile.compiler
          - name: runner
            dockerfile: Dockerfile.runner
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: ${{ matrix.image.dockerfile }}
          tags: ghcr.io/${{ github.repository_owner }}/brain-${{ matrix.image.name }}:${{ inputs.release_sha }}

  publish-manifest:
    needs: publish-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Collect digest manifest
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          manifest='{"commit_sha":"'"${RELEASE_SHA}"'","images":{'
          separator=''
          for image in backend compiler runner; do
            digest="$(docker buildx imagetools inspect "ghcr.io/${IMAGE_OWNER}/brain-${image}:${RELEASE_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test -n "${digest}"
            manifest="${manifest}${separator}\"${image}\":\"ghcr.io/${IMAGE_OWNER}/brain-${image}@${digest}\""
            separator=','
          done
          printf '%s}}\n' "${manifest}" > release-manifest.json
          cat release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release-manifest-${{ inputs.release_sha }}
          path: release-manifest.json

  verify-images:
    needs: publish-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and smoke-test published images
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_PLATFORM: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          for image in backend compiler runner; do
            digest="$(docker buildx imagetools inspect "ghcr.io/${IMAGE_OWNER}/brain-${image}:${RELEASE_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
            reference="ghcr.io/${IMAGE_OWNER}/brain-${image}@${digest}"
            docker pull --platform "${TARGET_PLATFORM}" "${reference}"
            docker buildx imagetools inspect "${reference}" --format '{{json .Manifest.Manifests}}' \
              | grep -Fq '"architecture":"'"${TARGET_PLATFORM##*/}"'"'
            if [ "${image}" = compiler ] || [ "${image}" = runner ]; then
              docker run --rm --platform "${TARGET_PLATFORM}" --entrypoint node "${reference}" --version
            fi
          done
