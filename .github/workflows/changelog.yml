name: changelog

on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update changelog
        shell: bash
        run: |
          {
            echo '# Changelog'
            echo
            echo 'Automatically generated from commits on main.'
            echo
            echo '## Unreleased'
            while IFS='|' read -r hash date subject; do
              echo "- \`$hash\` — $date — $subject"
              echo "  Files: $(git show --format= --name-only "$hash" | sed '/^$/d' | paste -sd ', ' -)"
            done < <(git log -50 --date=iso --pretty='%h|%ad|%s')
          } > CHANGELOG.md
      - name: Commit changelog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m 'docs: update changelog [skip ci]'
          git pull --rebase origin main
          git push
