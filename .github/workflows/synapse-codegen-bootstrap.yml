name: Synapse code generation bootstrap
on:
  push:
    branches:
      - architecture/synapse-codegen
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate pinned protobuf bindings and resolve dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          protoc -I . --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative proto/synapse/v1/synapse.proto
          go get google.golang.org/grpc@v1.70.0 google.golang.org/protobuf@v1.36.5
          go mod tidy
          go test ./proto/synapse/v1
          go test -race -coverpkg=./internal/execution,./internal/cortex,./internal/synapse -coverprofile=/tmp/synapse.cover ./tests/execution ./tests/cortex ./tests/synapse
          go tool cover -func=/tmp/synapse.cover | tail -1
      - name: Export only generated public repository source files
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ('go.mod','go.sum','proto/synapse/v1/synapse.pb.go','proto/synapse/v1/synapse_grpc.pb.go'):
              encoded = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              print('BRAIN_GENERATED_BEGIN ' + name)
              for i in range(0,len(encoded),2048):
                  print('BRAIN_GENERATED_CHUNK ' + encoded[i:i+2048])
              print('BRAIN_GENERATED_END ' + name)
          PY
