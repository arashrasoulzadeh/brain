services:
  brain:
    build:
      context: .
    environment:
      HTTP_ADDRESS: ":8080"
      RUNTIME_DSN: "postgres://brain_runtime:runtime_password@postgres:5432/brain"
      MIGRATION_DSN: "postgres://brain_migrator:migration_password@postgres:5432/brain"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain_migrator
      POSTGRES_PASSWORD: migration_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_migrator -d brain"]
      interval: 2s
      timeout: 2s
      retries: 15
